# Continuous integration for the upscaler.
#
# `on:` carries `push: tags: ["v*"]` on purpose, and it is the first thing in
# this file that has to be right. A tag push fires neither `pull_request` nor
# `push: branches:` — GitHub matches the two independently — so without the
# `tags` entry no job in this file would run when a release tag is pushed, and
# `release.yml`, which publishes on exactly that event, would ship a commit that
# never passed lint, never type-checked and never ran a test.
name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

# Least privilege: CI reads the repository and nothing else. The `release`
# workflow is the only file that asks for `contents: write`, and it asks for it
# per job rather than at the top level.
permissions:
  contents: read

concurrency:
  # One run per ref. A second push to a pull request supersedes the run that is
  # already testing the first one, so an open pull request does not accumulate
  # six stale runs while its author rebases.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  # GitHub's Windows runners default to a legacy code page; UTF-8 is what the
  # catalogue, the log files and the em dashes in the messages assume.
  PYTHONUTF8: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the linter
        shell: bash
        run: |
          set -euo pipefail
          # Ruff reads files and does not import them, so the linter job needs
          # no dependency tree at all. That is deliberate: the tree cannot be
          # installed on every runner in a couple of minutes, and a lint job
          # that spends four minutes downloading PySide6 to look at syntax is
          # a lint job people learn to wait for instead of watching.
          python -m pip install --upgrade pip
          python -m pip install ruff
      - name: ruff check
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check .
      - name: ruff format --check
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff format --check .
      - name: The packaging scripts must parse
        shell: bash
        run: |
          set -euo pipefail
          # `release.yml` executes packaging/**/*.sh and the PowerShell script
          # on a runner, where a syntax error is a failed release rather than a
          # failed commit. `bash -n` parses without executing, so it costs
          # milliseconds and cannot touch a build.
          shopt -s nullglob
          scripts=(packaging/*/*.sh)
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "::error::no packaging shell scripts were found to check"
            exit 1
          fi
          for script in "${scripts[@]}"; do
            echo "::group::bash -n $script"
            bash -n "$script"
            echo "::endgroup::"
          done

  types:
    name: types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the dependency tree
        shell: bash
        run: |
          set -euo pipefail
          # The same install the test job does, and for the same reason; see the
          # long comment on that step. What differs is the extra list: mypy
          # needs the *runtime* dependencies — without them `numpy.ndarray` and
          # `cv2.VideoCapture` degrade to `Any` and the checker stops being
          # worth running — and neither `cpu` nor `cuda` is among them, so
          # there is no multi-gigabyte download on this path.
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python - --extras=dev <<'PYTHON'
          import pathlib
          import subprocess
          import sys
          import tomllib

          project = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text()
          )["project"]
          wanted = list(project["dependencies"])
          # The extras are named on the command line above, so pyproject.toml
          # stays the only list of dependencies in the repository. An empty
          # value means the base dependency set and no extra.
          try:
              raw = next(a for a in sys.argv if a.startswith("--extras="))
          except StopIteration:
              raise SystemExit(
                  "name the extras: `--extras=cpu,dev`, or `--extras=` for none"
              ) from None
          for extra in [n for n in raw.removeprefix("--extras=").split(",") if n]:
              wanted += project["optional-dependencies"][extra]


          def name(requirement: str) -> str:
              """`onnxruntime-gpu[cuda,cudnn]==1.26.0` -> `onnxruntime-gpu`."""
              head = requirement.split("[")[0]
              for separator in ("==", ">=", "<=", "~=", "!=", ">", "<"):
                  head = head.split(separator)[0]
              return head.strip().lower()


          def core_of(requirement: str) -> str:
              """`toga==0.5.6` -> `toga-core==0.5.6`: the backend-less half."""
              prefix, _, version = requirement.partition("==")
              return f"{prefix}-core=={version}" if version else f"{prefix}-core"


          # `toga` is deferred on every platform, not just Linux. Its own
          # import resolves to `toga-core`, and the suite drives the
          # `toga-dummy` backend, so the platform backend is a dependency the
          # tests never use: on Linux it is `toga-gtk`, which needs PyGObject
          # (a source distribution whose build needs the GObject-introspection
          # headers, and a job that cannot install at all), and on Windows it
          # is `toga-winforms`, which pulls a second PySide6.
          linux = sys.platform.startswith("linux")
          deferred = {"toga"}
          plain = [r for r in wanted if name(r) not in deferred]
          held = [r for r in wanted if name(r) in deferred]
          command = [sys.executable, "-m", "pip", "install"]
          if linux:
              command += ["--extra-index-url", "https://download.pytorch.org/whl/cpu"]
          subprocess.check_call([*command, *plain])
          # `pip install` with no requirement is an error, so this is guarded
          # rather than run with an empty list.
          if held:
              subprocess.check_call(
                  [
                      sys.executable,
                      "-m",
                      "pip",
                      "install",
                      "--no-deps",
                      *held,
                      *(core_of(r) for r in held),
                  ]
              )
          # The project last, and with `--no-deps`: everything it asks for is
          # already above, and letting pip resolve the tree again would walk
          # straight back into the `toga` backend chain this avoids.
          subprocess.check_call(
              [sys.executable, "-m", "pip", "install", "--no-deps", "-e", "."]
          )
          PYTHON
      - name: mypy --strict
        shell: bash
        run: |
          set -euo pipefail
          # The front-ends are type-checked too, not just core/. The frozen
          # entry point, the main window and both Toga widgets are the parts
          # that break silently at import time on a platform nobody tested.
          .venv/bin/python -m mypy core/ ui_pyside/ ui_toga/

  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # One red platform must not hide the state of the other five.
      fail-fast: false
      matrix:
        # macos-13 is x86_64, which is the point: it is the runner where a wheel
        # that only ever shipped arm64 fails, and where the CoreML path is not
        # even available so a macOS-specific import bug surfaces.
        os: [ubuntu-latest, windows-latest, macos-13]
        python: ["3.11", "3.12"]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Cache the virtual environment
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          # Keyed on the exact interpreter build, not on "3.12": a virtual
          # environment records the absolute path of the interpreter it was
          # created from, and the hosted image moves that path with every patch
          # release. Deliberately no `restore-keys` — a partial match on
          # pyproject.toml alone would restore an environment built by another
          # patch release, which fails with a message about the standard
          # library rather than about the cache. `python -m venv` below rewrites
          # the absolute paths either way, so the entry is safe to reuse.
          key: venv-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('pyproject.toml') }}
      - name: Install the Qt runtime libraries
        # PySide6's QtGui links libEGL at import time, so `import
        # PySide6.QtWidgets` fails on a headless Linux runner that does not have
        # it. This is the platform-specific defect the matrix exists to catch:
        # it passes on Ubuntu 22.04, which has the package installed as a
        # desktop dependency, and fails on a CI image that never installed it.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1
      - name: Install ffmpeg
        # The GitHub images do not all carry ffmpeg, and the suite needs a real
        # one: `core.ffmpeg` prefers the system binary, and the tests that build
        # a clip, extract frames and encode a video cannot use the bundled
        # fallback for `ffprobe`, which imageio-ffmpeg does not ship. Windows
        # has no package manager here, so it relies on the bundled binary and
        # takes the ffmpeg-only `probe()` path - which is a path worth
        # exercising anyway.
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS}" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends --yes ffmpeg
          else
            brew install ffmpeg || brew upgrade ffmpeg
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Create the virtual environment
        id: venv
        shell: bash
        run: |
          set -euo pipefail
          # Unconditional, so a restored environment is repaired rather than
          # trusted: `python -m venv` rewrites pyvenv.cfg and the bin/python
          # symlink to the interpreter this job actually got.
          python -m venv .venv
          # Windows puts the interpreter in Scripts/ and calls it python.exe.
          # Hard-coding bin/ here fails with "command not found" and exit 127
          # on windows-latest, which is the second platform-only defect the
          # matrix exists to surface.
          if [ "${RUNNER_OS}" = "Windows" ]; then
            echo "python=.venv/Scripts/python.exe" >> "$GITHUB_OUTPUT"
          else
            echo "python=.venv/bin/python" >> "$GITHUB_OUTPUT"
          fi
        # `python -m venv` is enough: a restored environment is repaired, not
        # trusted, and the interpreter path is derived below.
      - name: Check the environment
        shell: bash
        run: |
          set -euo pipefail
          "${{ steps.venv.outputs.python }}" -m pip install --upgrade pip
          "${{ steps.venv.outputs.python }}" -V
      - name: Install
        shell: bash
        run: |
          set -euo pipefail
          # The dependency list is generated from pyproject.toml rather than
          # written out here, so pyproject.toml stays the only list.
          #
          # One exception, and it is why this is not a single `pip install`:
          # `toga` is a meta-package whose Linux backend is `toga-gtk`, which
          # needs PyGObject — a source distribution with no wheel, whose build
          # needs the GObject-introspection development headers. On a runner
          # that is a job which cannot install at all, before it has run a
          # single test. Nothing in the suite needs a GTK backend: the tests
          # import `toga` and run against `toga-dummy`, and `toga`'s own import
          # resolves to `toga-core`, a pure-Python wheel. So on Linux `toga` is
          # installed with `--no-deps` beside the `toga-core` of the same
          # version, and the backend chain is left out deliberately.
          # packaging/linux/build-deb.sh drops `toga*` from the bundle for the
          # same reason, in the same words.
          #
          # The extra index is for the Linux leg only, and it is load-bearing:
          # `torch==2.7.1` on PyPI for Linux x86-64 is the CUDA wheel, which
          # drags in the whole nvidia-* stack for a run with no GPU. The CPU
          # index publishes `2.7.1+cpu`, and PEP 440 sorts a local version
          # above the bare one, so pip prefers it and `==2.7.1` is still
          # satisfied. On macOS and Windows the public wheel is already
          # CPU-only, so the flag changes nothing there.
          "${{ steps.venv.outputs.python }}" - --extras=cpu,dev <<'PYTHON'
          import pathlib
          import subprocess
          import sys
          import tomllib

          project = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text()
          )["project"]
          wanted = list(project["dependencies"])
          # The extras are named on the command line above, so pyproject.toml
          # stays the only list of dependencies in the repository. An empty
          # value means the base dependency set and no extra.
          try:
              raw = next(a for a in sys.argv if a.startswith("--extras="))
          except StopIteration:
              raise SystemExit(
                  "name the extras: `--extras=cpu,dev`, or `--extras=` for none"
              ) from None
          for extra in [n for n in raw.removeprefix("--extras=").split(",") if n]:
              wanted += project["optional-dependencies"][extra]


          def name(requirement: str) -> str:
              """`onnxruntime-gpu[cuda,cudnn]==1.26.0` -> `onnxruntime-gpu`."""
              head = requirement.split("[")[0]
              for separator in ("==", ">=", "<=", "~=", "!=", ">", "<"):
                  head = head.split(separator)[0]
              return head.strip().lower()


          def core_of(requirement: str) -> str:
              """`toga==0.5.6` -> `toga-core==0.5.6`: the backend-less half."""
              prefix, _, version = requirement.partition("==")
              return f"{prefix}-core=={version}" if version else f"{prefix}-core"


          linux = sys.platform.startswith("linux")
          deferred = {"toga"}
          plain = [r for r in wanted if name(r) not in deferred]
          held = [r for r in wanted if name(r) in deferred]
          command = [sys.executable, "-m", "pip", "install"]
          if linux:
              command += ["--extra-index-url", "https://download.pytorch.org/whl/cpu"]
          subprocess.check_call([*command, *plain])
          # `pip install` with no requirement is an error, so this is guarded
          # rather than run with an empty list.
          if held:
              subprocess.check_call(
                  [
                      sys.executable,
                      "-m",
                      "pip",
                      "install",
                      "--no-deps",
                      *held,
                      *(core_of(r) for r in held),
                  ]
              )
          # The project last, and with `--no-deps`: everything it asks for is
          # already above, and letting pip resolve the tree again would walk
          # straight back into the `toga` backend chain this avoids. This
          # editable install is also what puts `core`, `ui_pyside` and
          # `ui_toga` on sys.path, and it is the project's own supported
          # install path, so the suite exercising it is the honest test — and
          # it is what proves the hatch wheel configuration still names three
          # packages that exist.
          subprocess.check_call(
              [sys.executable, "-m", "pip", "install", "--no-deps", "-e", "."]
          )
          PYTHON
      - name: pytest
        shell: bash
        env:
          # PySide6 cannot open a window on a runner with no display, and the
          # widget tests are the ones that would find out. The offscreen
          # platform plugin is the supported way to run them; on Windows the
          # native plugin is the correct name and is also the default, so it
          # is spelled out rather than left to a conditional env block.
          QT_QPA_PLATFORM: ${{ runner.os == 'Windows' && 'windows' || 'offscreen' }}
        run: |
          set -euo pipefail
          # `python -m pytest`, never the bare `pytest`: only the module form
          # puts the current directory on sys.path, and a test that imports
          # `core` must not depend on how the runner happened to invoke it.
          #
          # `gpu` and `network` are deselected because the GPU tests need an
          # accelerator (scripts/verify_gpu.py is that gate) and the live
          # OpenModelDB test is a scheduled job, not a pull-request check: it
          # fails when a third party's markup changes, which says nothing about
          # this commit.
          "${{ steps.venv.outputs.python }}" -m pytest -m "not gpu and not network"

  # There is deliberately no job here that freezes `ui_pyside/main.py` and
  # runs `scripts/verify_install.py` against the bundle. That check belongs to
  # the build jobs in release.yml, and for a concrete reason: PyInstaller's
  # analysis and collection of a PySide6 application takes minutes on its own,
  # and on top of it the bundle has to be handed a ~500 MiB dependency tree
  # before a job can say anything about it. Adding that to every pull request
  # would cost more runner time than lint, types and the whole test matrix put
  # together, to re-prove on every push what the tag push proves once. The
  # packaging shell scripts are still parsed here — see the `lint` job — so a
  # broken script is caught in a pull request rather than in a release.

  # The single check branch protection requires. It exists so the required-check
  # list has one entry that means "everything", instead of three that have to be
  # edited every time a job is added — and because a job that is merely skipped
  # is not the same signal to a reviewer as one that ran.
  ci:
    name: ci
    needs: [lint, types, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report what ran
        shell: bash
        env:
          LINT: ${{ needs.lint.result }}
          TYPES: ${{ needs.types.result }}
          TEST: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          echo "lint: $LINT"
          echo "types: $TYPES"
          echo "test: $TEST"
